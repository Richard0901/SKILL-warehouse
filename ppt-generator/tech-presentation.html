<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科技风演示文稿</title>
    <!-- 使用国内 CDN 加载 TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 使用国内 CDN (loli.net) 加载字体: Inter 和 备用思源黑体 (Noto Sans SC) -->
    <link href="https://fonts.loli.net/css2?family=Inter:wght@300;700;900&family=Noto+Sans+SC:wght@300;700;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind 自定义配置与全局样式 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'HarmonyOS Sans SC', 'Noto Sans SC', 'sans-serif'],
                    },
                    colors: {
                        black: '#0a0a0a',
                        'gray-primary': '#f4f4f5',
                        'gray-secondary': '#a1a1aa'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            -webkit-font-smoothing: antialiased;
        }

        /* 16:9 横屏比例容器 */
        #presentation-container {
            width: 100%;
            height: 100%;
            /* 保持 16:9 比例 */
            aspect-ratio: 16 / 9;
            max-width: 177.78vh; /* 16/9 * 100vh */
            max-height: 100vh;
            position: relative;
            background-color: #050505;
            
            /* 网格背景 (类似参考图) */
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 60px rgba(0,0,0,0.8);
        }

        /* 适配宽屏幕，确保始终居中且比例正确 */
        @media (min-aspect-ratio: 16/9) {
            #presentation-container {
                max-width: 177.78vh;
                height: 100vh;
            }
        }

        /* 背景效果: 模糊浮动光斑 */
        .light-spot {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px); /* 增加模糊度使得光晕更柔和 */
            opacity: 0.4;
            animation: float 20s infinite ease-in-out alternate;
            z-index: 0;
        }
        /* 参考图配色：左侧蓝色，右上方偏黄/橙色，右下方偏紫/粉红 */
        .spot-1 { width: 500px; height: 500px; background: rgba(30, 64, 175, 0.4); top: 20%; left: -10%; animation-delay: 0s; }
        .spot-2 { width: 450px; height: 450px; background: rgba(234, 179, 8, 0.2); top: -10%; right: 10%; animation-delay: -5s; }
        .spot-3 { width: 600px; height: 600px; background: rgba(190, 24, 93, 0.25); bottom: -20%; right: -5%; animation-delay: -10s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(60px, -40px) scale(1.05); }
            100% { transform: translate(-30px, 50px) scale(0.95); }
        }

        /* 幻灯片图层切换效果 */
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 4rem;
            opacity: 0;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateY(20px) scale(0.98);
            pointer-events: none;
            z-index: 10;
        }
        .slide.active {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        /* 底部导航栏 */
        #nav-dots {
            position: absolute;
            bottom: 2rem;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 16px;
            z-index: 20;
        }
        .dot {
            width: 8px;
            height: 8px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .dot:hover {
            background: rgba(255,255,255,0.5);
        }
        .dot.active {
            background: rgba(255,255,255,0.9);
            width: 32px;   /* 变为长条形增强设计感 */
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(255,255,255,0.4);
        }

        /* 自定义文本发光特效（参考图底部的文字发光） */
        .text-glow {
            text-shadow: 0 0 20px rgba(239, 68, 68, 0.8), 0 0 40px rgba(239, 68, 68, 0.4);
        }
    </style>
</head>
<body class="font-sans">

    <div id="presentation-container">
        <!-- 动态背景光斑 (根据参考图调整为蓝、黄、粉紫) -->
        <div class="light-spot spot-1"></div>
        <div class="light-spot spot-2"></div>
        <div class="light-spot spot-3"></div>

        <!-- 01 参考图还原页：多层级文本展示 -->
        <div class="slide active">
            <div class="text-center w-full z-10 relative flex flex-col items-center gap-8">
                <p class="text-3xl text-gray-300 font-light tracking-widest">我踩的大坑</p>
                
                <!-- 渐变大字标题 (从红到黄的渐变) -->
                <h1 class="text-8xl md:text-9xl font-black text-transparent bg-clip-text bg-gradient-to-r from-red-500 via-orange-400 to-yellow-400 drop-shadow-sm my-4">
                    关于记忆
                </h1>
                
                <p class="text-3xl text-gray-300 font-light tracking-widest">养一窝龙虾</p>
                
                <!-- 发光红色文字 -->
                <p class="text-4xl text-red-300 font-bold tracking-widest mt-4 text-glow opacity-90">
                    绝对不能把记忆当回事儿
                </p>
            </div>
        </div>

        <!-- 02 步骤页：横屏排版示例 -->
        <div class="slide">
            <div class="w-full h-full relative z-10 flex flex-col justify-center px-16">
                <!-- 顶部标题 -->
                <div class="mb-16">
                    <h2 class="text-5xl font-black text-white tracking-widest">核心理论</h2>
                    <div class="w-16 h-1 bg-gradient-to-r from-red-500 to-yellow-400 mt-4"></div>
                </div>
                
                <!-- 横向三列布局 -->
                <div class="grid grid-cols-3 gap-12 w-full">
                    <div class="group relative bg-[#111] bg-opacity-50 p-8 rounded-2xl border border-white border-opacity-10 backdrop-blur-sm">
                        <span class="text-7xl font-black text-white opacity-10 absolute -top-4 -left-2">01</span>
                        <h3 class="text-2xl font-bold text-gray-100 mb-4 relative z-10">重构感知</h3>
                        <p class="text-base text-gray-400 font-light leading-relaxed">突破数据壁垒的全域接入，实现多维度的信息聚合与分析。</p>
                    </div>
                    <div class="group relative bg-[#111] bg-opacity-50 p-8 rounded-2xl border border-white border-opacity-10 backdrop-blur-sm">
                        <span class="text-7xl font-black text-white opacity-10 absolute -top-4 -left-2">02</span>
                        <h3 class="text-2xl font-bold text-gray-100 mb-4 relative z-10">深度推理</h3>
                        <p class="text-base text-gray-400 font-light leading-relaxed">基于千亿参数的毫秒级决策能力，建立高效的链路闭环。</p>
                    </div>
                    <div class="group relative bg-[#111] bg-opacity-50 p-8 rounded-2xl border border-white border-opacity-10 backdrop-blur-sm">
                        <span class="text-7xl font-black text-white opacity-10 absolute -top-4 -left-2">03</span>
                        <h3 class="text-2xl font-bold text-gray-100 mb-4 relative z-10">智能执行</h3>
                        <p class="text-base text-gray-400 font-light leading-relaxed">无缝融合系统底层自动化生态，赋予极其敏捷和精准的动作输出。</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 03 结尾页：总结 + 行动号召 -->
        <div class="slide">
            <div class="text-center w-full z-10 relative">
                <h2 class="text-6xl font-black mb-12 leading-tight text-white">未来已来<br><span class="text-3xl font-light text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 block mt-6 tracking-widest">触手可及的奇点</span></h2>
                <button class="px-10 py-5 bg-white text-black text-xl font-bold rounded-full transition-transform duration-300 hover:scale-105 hover:shadow-[0_0_30px_rgba(255,255,255,0.3)] focus:outline-none focus:ring-4 focus:ring-gray-300">
                    开启新纪元
                </button>
            </div>
        </div>

        <!-- 底部导航点 -->
        <div id="nav-dots"></div>
    </div>

    <!-- 交互逻辑 -->
    <script>
        const slides = document.querySelectorAll('.slide');
        const dotsContainer = document.getElementById('nav-dots');
        let currentSlide = 0;

        // 初始化导航点
        slides.forEach((_, index) => {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            if (index === 0) dot.classList.add('active');
            
            // 点击切换
            dot.addEventListener('click', () => {
                currentSlide = index;
                updateView();
            });
            dotsContainer.appendChild(dot);
        });

        const dots = document.querySelectorAll('.dot');

        // 更新视图逻辑
        function updateView() {
            slides.forEach((slide, index) => {
                if (index === currentSlide) {
                    slide.classList.add('active');
                } else {
                    slide.classList.remove('active');
                }
            });
            dots.forEach((dot, index) => {
                if (index === currentSlide) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        }

        function next() {
            if(currentSlide < slides.length - 1) {
                currentSlide++;
                updateView();
            }
        }

        function prev() {
            if(currentSlide > 0) {
                currentSlide--;
                updateView();
            }
        }

        // 键盘左右键控制
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
                next();
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                prev();
            }
        });
    </script>
</body>
</html>
